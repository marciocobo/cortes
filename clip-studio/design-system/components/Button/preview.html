<!doctype html>
<html>
<head><meta charset="utf-8"><title>Button</title>
<style>body{padding:16px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}</style>
</head>
<body>
<div class="row">
  <button class="btn-primary" style="width:auto;padding:12px 24px">Enviar</button>
  <button class="btn-primary" style="width:auto;padding:12px 24px" disabled>Enviando...</button>
</div>
<div class="row">
  <button class="btn-ghost">Cancelar</button>
  <button class="btn-light">Salvar</button>
  <button class="btn-secondary">Redefinir senha</button>
  <button class="btn-danger">Excluir</button>
</div>
</body>
</html>
