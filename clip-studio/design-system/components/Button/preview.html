<!doctype html>
<html>
<head><meta charset="utf-8"><title>Button</title>
<style>body{padding:16px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}</style>
</head>
<body>
<div class="row">
  <button class="btn-primary">Enviar</button>
  <button class="btn-primary" disabled>Enviando...</button>
  <button class="btn-secondary btn-sm">Desativar</button>
  <button class="btn-link">Sair</button>
</div>
<div class="row">
  <button class="btn-ghost">Cancelar</button>
  <button class="btn-primary">Salvar</button>
  <button class="btn-secondary">Reativar</button>
  <button class="btn-danger">Excluir</button>
</div>
</body>
</html>
