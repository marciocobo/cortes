<!doctype html>
<html>
<head><meta charset="utf-8"><title>Modal</title>
<style>html,body{height:100%}.modal-overlay{position:absolute}</style>
</head>
<body>
<div class="modal-overlay">
  <div class="modal" style="max-width:440px" role="dialog" aria-labelledby="t">
    <div class="modal-title" id="t">Excluir clipe</div>
    <p class="modal-text">Tem certeza que deseja excluir "Deus não deixa inacabado"? Essa ação não pode ser desfeita.</p>
    <div class="modal-footer">
      <button class="btn-ghost">Cancelar</button>
      <button class="btn-danger">Excluir</button>
    </div>
  </div>
</div>
</body>
</html>
