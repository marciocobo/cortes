<!doctype html>
<html>
<head><meta charset="utf-8"><title>Field</title>
<style>body{padding:16px;max-width:560px}</style>
</head>
<body>
<div class="field" style="margin-bottom:16px">
  <label for="title">Título do vídeo</label>
  <input id="title" type="text" placeholder="Ex: Podcast #58 - Convidado especial">
</div>
<div class="field" style="margin-bottom:16px">
  <label for="url">Link do YouTube</label>
  <input id="url" type="url" value="https://www.youtube.com/watch?v=4PdRgC-xvsE">
</div>
<div class="field">
  <label for="adm">E-mail (admin)</label>
  <input id="adm" class="input-field" type="email" placeholder="nome@igreja.com.br">
</div>
</body>
</html>
