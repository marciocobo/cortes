<!doctype html>
<html>
<head><meta charset="utf-8"><title>Field</title>
<style>body{padding:16px;max-width:560px}</style>
</head>
<body>
<div class="field">
  <label for="title">Título do vídeo</label>
  <input id="title" type="text" placeholder="Ex: Podcast #58 - Convidado especial">
</div>
<div class="field">
  <label for="url">Link do YouTube</label>
  <input id="url" type="url" value="https://www.youtube.com/watch?v=4PdRgC-xvsE">
</div>
<form class="inline-form">
  <input class="input-field" placeholder="Nome">
  <input class="input-field" type="email" placeholder="E-mail">
  <select class="select"><option>Clipador</option><option>Uploader</option><option>Admin</option></select>
  <button class="btn-primary" type="button">Adicionar</button>
</form>
</body>
</html>
