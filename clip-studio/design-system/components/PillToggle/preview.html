<!doctype html>
<html>
<head><meta charset="utf-8"><title>PillToggle</title>
<style>body{padding:16px;max-width:560px}</style>
</head>
<body>
<div class="field" style="margin-bottom:16px">
  <div style="display:flex;gap:8px">
    <button class="pill-toggle pill-toggle-active" style="flex:1">Link do YouTube</button>
    <button class="pill-toggle" style="flex:1">Enviar arquivo</button>
  </div>
</div>
<div class="field">
  <label>Tipo de conteúdo *</label>
  <div style="display:flex;gap:8px;margin-top:4px" role="radiogroup">
    <button class="pill-toggle pill-toggle-active" role="radio" aria-checked="true">Pregação</button>
    <button class="pill-toggle" role="radio" aria-checked="false">Podcast</button>
    <button class="pill-toggle" role="radio" aria-checked="false">Louvor</button>
  </div>
</div>
</body>
</html>
