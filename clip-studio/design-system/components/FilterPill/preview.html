<!doctype html>
<html>
<head><meta charset="utf-8"><title>FilterPill</title>
<style>body{padding:16px}</style>
</head>
<body>
<div class="filter-row" style="margin-bottom:12px">
  <span class="filter-row-label">Tipo</span>
  <button class="filter-pill">Pregação</button>
  <button class="filter-pill filter-pill-active">Louvor</button>
  <button class="filter-pill">Podcast</button>
</div>
<div class="filter-row" style="margin-bottom:12px">
  <span class="filter-row-label">Categoria</span>
  <button class="filter-pill">Original</button>
  <button class="filter-pill filter-pill-active">Cortado</button>
  <button class="filter-pill">Processando</button>
</div>
<div class="filter-row">
  <span class="filter-row-label">Categoria</span>
  <button class="filter-pill" disabled title="Selecione um tipo primeiro">Original</button>
  <button class="filter-pill" disabled>Cortado</button>
  <button class="filter-pill" disabled>Processando</button>
</div>
</body>
</html>
