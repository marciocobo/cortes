<!-- @dsCard height=288 -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Clip Studio</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--text); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .ink { fill:var(--primary); }
  .brand { fill:var(--accent); }
  .pod { fill:var(--type-podcast); }
  .lou { fill:var(--type-louvor); }
  .dot { fill:var(--border-control); }
  .blk { rx:var(--radius-lg); }
  .words { position:absolute; left:var(--space-24); bottom:var(--space-24); max-width:440px; }
  .name { margin:0; font-family:var(--font-sans); font-size:100px; line-height:.95; font-weight:600; letter-spacing:-0.04em; color:var(--text); }
  .tag { margin:var(--space-12) 0 0 4px; font-size:14px; line-height:20px; color:var(--text-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      accent 144x256 (the brand blue, tallest), primary 117x208 (the inverted action fill), type-podcast 81x144 bleeding off the right edge, type-louvor 96x88 as the relief tint; about 35% of 960x288
  arrangement 9:16 Shorts frames standing on one baseline space-32 above the bottom edge, space-16 gutters, rising toward the brand block like clips on a timeline
  pattern     dot grid, from "Geist Mono, a 4px spacing scale, dense precise tool": 48 dots (6x8) in border-control at a space-16 pitch, top-left of the art box, clear of every block
  scales      gutters and dot pitch space-16; baseline space-32; corners radius-lg; dot radius space-2
-->
<g>
<circle class="dot" cx="16" cy="24" r="2"/><circle class="dot" cx="32" cy="24" r="2"/><circle class="dot" cx="48" cy="24" r="2"/><circle class="dot" cx="64" cy="24" r="2"/><circle class="dot" cx="80" cy="24" r="2"/><circle class="dot" cx="96" cy="24" r="2"/>
<circle class="dot" cx="16" cy="40" r="2"/><circle class="dot" cx="32" cy="40" r="2"/><circle class="dot" cx="48" cy="40" r="2"/><circle class="dot" cx="64" cy="40" r="2"/><circle class="dot" cx="80" cy="40" r="2"/><circle class="dot" cx="96" cy="40" r="2"/>
<circle class="dot" cx="16" cy="56" r="2"/><circle class="dot" cx="32" cy="56" r="2"/><circle class="dot" cx="48" cy="56" r="2"/><circle class="dot" cx="64" cy="56" r="2"/><circle class="dot" cx="80" cy="56" r="2"/><circle class="dot" cx="96" cy="56" r="2"/>
<circle class="dot" cx="16" cy="72" r="2"/><circle class="dot" cx="32" cy="72" r="2"/><circle class="dot" cx="48" cy="72" r="2"/><circle class="dot" cx="64" cy="72" r="2"/><circle class="dot" cx="80" cy="72" r="2"/><circle class="dot" cx="96" cy="72" r="2"/>
<circle class="dot" cx="16" cy="88" r="2"/><circle class="dot" cx="32" cy="88" r="2"/><circle class="dot" cx="48" cy="88" r="2"/><circle class="dot" cx="64" cy="88" r="2"/><circle class="dot" cx="80" cy="88" r="2"/><circle class="dot" cx="96" cy="88" r="2"/>
<circle class="dot" cx="16" cy="104" r="2"/><circle class="dot" cx="32" cy="104" r="2"/><circle class="dot" cx="48" cy="104" r="2"/><circle class="dot" cx="64" cy="104" r="2"/><circle class="dot" cx="80" cy="104" r="2"/><circle class="dot" cx="96" cy="104" r="2"/>
<circle class="dot" cx="16" cy="120" r="2"/><circle class="dot" cx="32" cy="120" r="2"/><circle class="dot" cx="48" cy="120" r="2"/><circle class="dot" cx="64" cy="120" r="2"/><circle class="dot" cx="80" cy="120" r="2"/><circle class="dot" cx="96" cy="120" r="2"/>
<circle class="dot" cx="16" cy="136" r="2"/><circle class="dot" cx="32" cy="136" r="2"/><circle class="dot" cx="48" cy="136" r="2"/><circle class="dot" cx="64" cy="136" r="2"/><circle class="dot" cx="80" cy="136" r="2"/><circle class="dot" cx="96" cy="136" r="2"/>
</g>
<rect class="lou blk" x="8" y="168" width="96" height="88" rx="12"/>
<rect class="ink blk" x="120" y="48" width="117" height="208" rx="12"/>
<rect class="brand blk" x="253" y="0" width="144" height="256" rx="12"/>
<rect class="pod blk" x="413" y="112" width="81" height="144" rx="12"/>
</svg>
</div>
<div class="words">
  <p class="name">Clip<br>Studio</p>
  <p class="tag">Cortes de pregação, louvor e podcast prontos para os Shorts.</p>
</div>
</div>
</body>
</html>
