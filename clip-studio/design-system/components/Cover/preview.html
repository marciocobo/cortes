<!-- @dsCard height=288 -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Clip Studio</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--text); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:640px; height:288px; }
  .deep { fill:var(--border-strong); }
  .brand { fill:var(--accent-blue); }
  .white { fill:var(--accent); }
  .pod { fill:var(--type-podcast); }
  .lou { fill:var(--type-louvor); }
  .cut { fill:var(--bg); }
  .blk { rx:var(--radius-xl); }
  /* pills are space-16 tall: rx = half the short side */
  .pl { rx:8px; }
  .words { position:absolute; left:var(--space-24); bottom:var(--space-24); max-width:440px; }
  .name { margin:0; font-family:var(--font-mono); font-size:100px; line-height:.95; font-weight:600; letter-spacing:.03em; color:var(--text); }
  .tag { margin:var(--space-8) 0 0 4px; font-size:14px; line-height:20px; color:var(--text-dim); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 640 288" width="640" height="288">
<!--
  blocks      four 9:16 Shorts frames: border-strong 144x256, accent-blue 117x208, accent 81x144, type-podcast 135x240 bleeding off the right edge; type-louvor only as small pills (about 38% of 960x288)
  arrangement a descending run of portrait frames, bottoms on one line space-32 above the edge, space-16 gutters, like clips laid out on a timeline
  pattern     pills, from "radius-pill on every control": a filter list cut out of the border-strong frame in the ground, two type-louvor pills loose on the ground below
  scales      gutters space-16; pill height space-16 at a space-24 pitch; corners radius-xl; pill rx half of space-16
-->
<rect class="deep blk" x="16" y="0" width="144" height="256" rx="10"/>
<rect class="brand blk" x="176" y="48" width="117" height="208" rx="10"/>
<rect class="white blk" x="309" y="112" width="81" height="144" rx="10"/>
<rect class="pod blk" x="406" y="16" width="135" height="240" rx="10"/>
<rect class="cut pl" x="32" y="32" width="96" height="16" rx="8"/>
<rect class="cut pl" x="32" y="56" width="72" height="16" rx="8"/>
<rect class="cut pl" x="32" y="80" width="112" height="16" rx="8"/>
<rect class="cut pl" x="32" y="104" width="56" height="16" rx="8"/>
<rect class="lou pl" x="176" y="264" width="56" height="16" rx="8"/>
<rect class="lou pl" x="240" y="264" width="32" height="16" rx="8"/>
</svg>
</div>
<div class="words">
  <p class="name">Clip<br>Studio</p>
  <p class="tag">Cortes de pregação, louvor e podcast prontos para os Shorts.</p>
</div>
</div>
</body>
</html>
