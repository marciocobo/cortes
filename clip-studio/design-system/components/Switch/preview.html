<!doctype html>
<html>
<head><meta charset="utf-8"><title>Switch</title>
<style>body{padding:16px;max-width:560px}</style>
</head>
<body>
<div class="setting-row">
  <div class="setting-title">Modo Palavra Completa</div>
  <button class="switch" role="switch" aria-checked="false" aria-label="Modo Palavra Completa"><span class="knob"></span></button>
</div>
<div class="setting-row" style="margin:0">
  <div>
    <div class="setting-title">Remover silêncios (Jump Cut)</div>
    <div class="setting-hint">Corta automaticamente os trechos sem fala no vídeo inteiro</div>
  </div>
  <button class="switch" role="switch" aria-checked="true" aria-label="Remover silêncios (Jump Cut)"><span class="knob"></span></button>
</div>
</body>
</html>
