<!doctype html>
<html>
<head><meta charset="utf-8"><title>TrimTrack</title>
<style>body{padding:24px 24px 16px;max-width:520px}</style>
</head>
<body>
<div class="trim-times"><span>0:42.3 / 2:58.0</span><span>Selecionado: 1:31.5</span></div>
<div class="trim-track">
  <div class="trim-range" style="left:12%;width:51%"></div>
  <div class="trim-playhead" style="left:24%"></div>
  <div class="trim-handle" role="slider" tabindex="0" aria-label="Início do corte" style="left:12%"></div>
  <div class="trim-handle" role="slider" tabindex="0" aria-label="Fim do corte" style="left:63%"></div>
</div>
<div class="trim-steppers" style="margin:0">
  <div class="stepper"><button class="icon-btn icon-btn-text" aria-label="Diminuir início em 0.1s">−</button><span>Início: 0:21.4</span><button class="icon-btn icon-btn-text" aria-label="Aumentar início em 0.1s">+</button></div>
  <div class="stepper"><button class="icon-btn icon-btn-text" aria-label="Diminuir fim em 0.1s">−</button><span>Fim: 1:52.9</span><button class="icon-btn icon-btn-text" aria-label="Aumentar fim em 0.1s">+</button></div>
</div>
</body>
</html>
