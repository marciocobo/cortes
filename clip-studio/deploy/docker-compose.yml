# Clip Studio deployment stack for the Contabo VPS documented in VPS.md.
# Mirrors the NutriFlow/GarantIA pattern already running there:
#   - its own Postgres container, not exposed publicly
#   - the web container joins the shared `n8n_default` network so the
#     existing Caddy container (n8n-caddy-1) can route to it by alias
#   - everything else stays on a private internal network
#
# Deploy from /root/clip-studio on the VPS (same layout as /root/nutrivion,
# /root/garantIA - see VPS.md §6):
#   docker compose --env-file .env up -d --build
#   docker compose exec web npm run db:migrate
#   docker compose exec web npm run db:seed   # first deploy only

services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: clipstudio-web-1
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - clipstudio_internal
      - n8n_default
    # No published ports - the shared Caddy container reaches it by
    # container name/alias on n8n_default (see ../CADDYFILE_SNIPPET.txt).

  postgres:
    image: postgres:16-alpine
    container_name: clipstudio-postgres-1
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - clipstudio_postgres_data:/var/lib/postgresql/data
    networks:
      - clipstudio_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Intentionally no `ports:` - matches VPS.md §12: "não expor
    # Postgres/Redis/MinIO publicamente".

networks:
  clipstudio_internal:
    driver: bridge
  n8n_default:
    external: true

volumes:
  clipstudio_postgres_data:
